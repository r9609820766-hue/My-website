<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Register | PremiumDev</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body {
      background: linear-gradient(145deg, #f1f5f9 0%, #e2e8f0 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
    }
    .bg-orb {
      position: fixed;
      width: 60vw;
      height: 60vw;
      background: radial-gradient(circle, rgba(59,130,246,0.15) 0%, rgba(139,92,246,0.08) 70%, transparent 100%);
      border-radius: 50%;
      top: -20%;
      right: -20%;
      z-index: 0;
      animation: float 25s infinite alternate ease-in-out;
    }
    .bg-orb-2 {
      left: -20%;
      top: auto;
      bottom: -20%;
      background: radial-gradient(circle, rgba(6,182,212,0.12) 0%, rgba(59,130,246,0.05) 70%, transparent 100%);
      animation-duration: 30s;
    }
    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(5%, 5%) scale(1.05); }
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.4rem;
      font-weight: 800;
      background: linear-gradient(135deg, #1e40af, #3b82f6, #06b6d4);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.02em;
    }
    .since-badge {
      font-size: 0.65rem;
      font-weight: 500;
      background: #eef2ff;
      color: #1e40af;
      border-radius: 40px;
      padding: 0.15rem 0.7rem;
      margin-left: 0.5rem;
    }
    .register-card {
      max-width: 420px;
      width: 100%;
      background: rgba(255,255,255,0.98);
      backdrop-filter: blur(2px);
      border-radius: 1.75rem;
      box-shadow: 0 20px 35px -12px rgba(0,0,0,0.12);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      z-index: 10;
      position: relative;
      overflow: hidden;
    }
    .register-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #3b82f6, #8b5cf6, #06b6d4);
    }
    .register-card:hover { transform: translateY(-4px); box-shadow: 0 25px 40px -15px rgba(0,0,0,0.18); }
    .register-header {
      padding: 1.8rem 1.8rem 1rem;
      text-align: center;
      border-bottom: 1px solid #edf2f7;
    }
    .register-header i {
      font-size: 2.4rem;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 0.3rem;
    }
    .register-header h2 { font-weight: 700; font-size: 1.6rem; color: #0f172a; margin-bottom: 0.2rem; }
    .register-header p { color: #64748b; font-size: 0.85rem; }
    .form-body { padding: 1.8rem; }
    .form-label { font-weight: 600; color: #1e293b; margin-bottom: 0.3rem; font-size: 0.85rem; }
    .input-group { border-radius: 0.9rem; transition: all 0.2s; }
    .input-group-text {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-right: none;
      border-radius: 0.9rem 0 0 0.9rem;
      color: #64748b;
      font-size: 0.9rem;
      padding: 0.5rem 0.8rem;
    }
    .form-control {
      background: white;
      border: 1px solid #e2e8f0;
      border-left: none;
      border-radius: 0 0.9rem 0.9rem 0;
      padding: 0.55rem 0.8rem;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .form-control:focus { border-color: #8b5cf6; box-shadow: none; outline: none; }
    .input-group:focus-within { box-shadow: 0 0 0 2px rgba(139,92,246,0.2); border-radius: 0.9rem; }
    .btn-register {
      background: linear-gradient(105deg, #3b82f6, #8b5cf6);
      border: none;
      font-weight: 600;
      padding: 0.65rem;
      border-radius: 2.5rem;
      font-size: 0.9rem;
      color: white;
      transition: all 0.2s;
      box-shadow: 0 3px 10px rgba(59,130,246,0.25);
      width: 100%;
    }
    .btn-register:hover { transform: scale(1.01); filter: brightness(1.02); box-shadow: 0 6px 15px rgba(59,130,246,0.35); }
    .error-msg { background: #fee2e2; color: #b91c1c; padding: 0.5rem; border-radius: 0.8rem; font-size: 0.75rem; border-left: 3px solid #ef4444; }
    .success-msg { background: #dcfce7; color: #166534; padding: 0.5rem; border-radius: 0.8rem; font-size: 0.75rem; border-left: 3px solid #22c55e; }
    .back-home {
      position: fixed; top: 1.2rem; left: 1.2rem;
      background: rgba(255,255,255,0.85); backdrop-filter: blur(8px);
      padding: 0.4rem 1rem; border-radius: 2.5rem;
      text-decoration: none; color: #3b82f6; font-weight: 500; border: 1px solid #e2e8f0;
      transition: all 0.2s; z-index: 100; font-size: 0.8rem;
    }
    .back-home:hover { background: white; transform: translateX(-3px); }
    footer { margin-top: 1rem; text-align: center; font-size: 0.65rem; color: #94a3b8; padding-bottom: 1rem; }
    .login-link { color: #3b82f6; text-decoration: none; font-weight: 600; font-size: 0.85rem; }
    hr { margin: 1rem 0; }
  </style>
</head>
<body>
  <div class="bg-orb"></div>
  <div class="bg-orb bg-orb-2"></div>
  <a href="index.html" class="back-home"><i class="bi bi-arrow-left"></i> Back</a>
  <div class="register-card">
    <div class="register-header">
      <i class="bi bi-person-plus-fill"></i>
      <h2>Create Account</h2>
      <p>Join as a customer</p>
      <div class="mt-2">
        <span class="brand"><i class="bi bi-briefcase-fill"></i> PremiumDev</span>
        <span class="since-badge">Since 2026</span>
      </div>
    </div>
    <div class="form-body">
      <form id="registerForm">
        <div class="mb-3">
          <label class="form-label">Full Name</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" id="fullName" class="form-control" placeholder="John Doe" required>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Phone Number</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-telephone"></i></span>
            <input type="tel" id="phone" class="form-control" placeholder="+880 1XXX XXXXXX" required>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Email Address</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" id="email" class="form-control" placeholder="you@example.com" required autocomplete="email">
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" id="password" class="form-control" placeholder="At least 6 chars" required autocomplete="new-password">
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label">Confirm Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-check-circle"></i></span>
            <input type="password" id="confirmPassword" class="form-control" placeholder="Retype password" required>
          </div>
        </div>
        <button type="submit" class="btn-register mt-1">Register <i class="bi bi-arrow-right ms-1"></i></button>
        <div id="messageArea" class="mt-3 text-center small"></div>
      </form>
      <hr>
      <p class="text-center mb-0">Already have an account? <a href="login.html" class="login-link">Login here</a></p>
      <div class="text-center mt-2"><small><a href="admin-login.html" class="text-muted" style="font-size:0.7rem;">Admin login</a></small></div>
      <footer><p class="mb-0">© 2026 PremiumDev</p></footer>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (function() {
      const SUPABASE_URL = 'https://xzhmjigiddhzyrhqwgcw.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh6aG1qaWdpZGRoenlyaHF3Z2N3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyNzkzMjQsImV4cCI6MjA5NTg1NTMyNH0.-G9WLCr4zcK5lCg_nBqBVcClhHJH_xunpflCakaDMEw';
      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      const form = document.getElementById('registerForm');
      const messageArea = document.getElementById('messageArea');

      function showError(msg) {
        messageArea.innerHTML = `<div class="error-msg"><i class="bi bi-exclamation-triangle-fill me-1"></i> ${msg}</div>`;
      }
      function showSuccess(msg) {
        messageArea.innerHTML = `<div class="success-msg"><i class="bi bi-check-circle-fill me-1"></i> ${msg}</div>`;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        messageArea.innerHTML = '';

        const fullName = document.getElementById('fullName').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirmPassword').value;

        if (!fullName || !phone || !email || !password) {
          showError('All fields are required.');
          return;
        }
        if (password !== confirm) {
          showError('Passwords do not match.');
          return;
        }
        if (password.length < 6) {
          showError('Password must be at least 6 characters.');
          return;
        }

        messageArea.innerHTML = '<div class="spinner-border spinner-border-sm text-primary" role="status"></div> Creating account...';

        const { data, error } = await supabase.auth.signUp({
          email,
          password,
          options: {
            data: {
              full_name: fullName,
              phone: phone
            }
          }
        });

        if (error) {
          showError(error.message);
          return;
        }

        showSuccess('✅ Registration successful! Please check your email to confirm your account, then login.');
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 4000);
      });
    })();
  </script>
</body>
</html>
