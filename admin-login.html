<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Admin Login | PremiumDev</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(145deg, #f1f5f9 0%, #e2e8f0 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      font-family: 'Inter', sans-serif;
    }
    .bg-orb {
      position: fixed;
      width: 60vw;
      height: 60vw;
      background: radial-gradient(circle, rgba(59,130,246,0.2) 0%, rgba(139,92,246,0.1) 70%, transparent 100%);
      border-radius: 50%;
      top: -20%;
      right: -20%;
      z-index: 0;
      animation: float 25s infinite alternate ease-in-out;
    }
    .bg-orb-2 {
      left: -20%;
      top: auto;
      bottom: -20%;
      background: radial-gradient(circle, rgba(6,182,212,0.15) 0%, rgba(59,130,246,0.05) 70%, transparent 100%);
      animation-duration: 30s;
    }
    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(5%, 5%) scale(1.05); }
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, #1e40af, #3b82f6, #06b6d4);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.02em;
    }
    .since-badge {
      font-size: 0.65rem;
      font-weight: 500;
      background: #eef2ff;
      color: #1e40af;
      border-radius: 40px;
      padding: 0.15rem 0.7rem;
      margin-left: 0.5rem;
    }
    .login-card {
      max-width: 440px;
      width: 100%;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(2px);
      border-radius: 2rem;
      box-shadow: 0 25px 45px -12px rgba(0,0,0,0.15), 0 0 0 1px rgba(0,0,0,0.02);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      z-index: 10;
      position: relative;
      overflow: hidden;
    }
    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #3b82f6, #8b5cf6, #06b6d4);
    }
    .login-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 30px 50px -15px rgba(0,0,0,0.2);
    }
    .login-header {
      padding: 2rem 2rem 1rem;
      text-align: center;
      border-bottom: 1px solid #edf2f7;
    }
    .login-header i {
      font-size: 2.8rem;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 0.5rem;
    }
    .login-header h2 {
      font-weight: 700;
      font-size: 1.8rem;
      color: #0f172a;
      margin-bottom: 0.25rem;
    }
    .login-header p {
      color: #64748b;
      font-size: 0.9rem;
    }
    .form-body {
      padding: 2rem;
    }
    .form-label {
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 0.4rem;
      font-size: 0.9rem;
    }
    .input-group {
      border-radius: 1rem;
      transition: all 0.2s;
    }
    .input-group-text {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-right: none;
      border-radius: 1rem 0 0 1rem;
      color: #64748b;
    }
    .form-control {
      background: white;
      border: 1px solid #e2e8f0;
      border-left: none;
      border-radius: 0 1rem 1rem 0;
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      transition: all 0.2s;
    }
    .form-control:focus {
      border-color: #8b5cf6;
      box-shadow: none;
      outline: none;
    }
    .input-group:focus-within {
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
      border-radius: 1rem;
    }
    .btn-login {
      background: linear-gradient(105deg, #3b82f6, #8b5cf6);
      border: none;
      font-weight: 600;
      padding: 0.8rem;
      border-radius: 3rem;
      font-size: 1rem;
      color: white;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(59,130,246,0.3);
      width: 100%;
    }
    .btn-login:hover {
      transform: scale(1.01);
      filter: brightness(1.02);
      box-shadow: 0 8px 20px rgba(59,130,246,0.4);
    }
    .error-msg {
      background: #fee2e2;
      color: #b91c1c;
      padding: 0.7rem;
      border-radius: 1rem;
      font-size: 0.85rem;
      border-left: 4px solid #ef4444;
    }
    .success-msg {
      background: #dcfce7;
      color: #166534;
      padding: 0.7rem;
      border-radius: 1rem;
      font-size: 0.85rem;
      border-left: 4px solid #22c55e;
    }
    .back-home {
      position: fixed;
      top: 1.5rem;
      left: 1.5rem;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(8px);
      padding: 0.5rem 1.2rem;
      border-radius: 3rem;
      text-decoration: none;
      color: #3b82f6;
      font-weight: 500;
      border: 1px solid #e2e8f0;
      transition: all 0.2s;
      z-index: 100;
      font-size: 0.9rem;
    }
    .back-home:hover {
      background: white;
      transform: translateX(-4px);
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    footer {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.7rem;
      color: #94a3b8;
      padding-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="bg-orb"></div>
  <div class="bg-orb bg-orb-2"></div>
  <a href="index.html" class="back-home"><i class="bi bi-arrow-left"></i> Back to Home</a>
  <div class="login-card">
    <div class="login-header">
      <i class="bi bi-shield-lock-fill"></i>
      <h2>Welcome back</h2>
      <p class="mb-0">Sign in to your admin dashboard</p>
      <div class="mt-2">
        <span class="brand"><i class="bi bi-briefcase-fill"></i> PremiumDev</span>
        <span class="since-badge">Since 2026</span>
      </div>
    </div>
    <div class="form-body">
      <form id="adminLoginForm">
        <div class="mb-4">
          <label class="form-label">Email address</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" id="email" class="form-control" placeholder="admin@example.com" required autocomplete="email">
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" id="password" class="form-control" placeholder="••••••" required autocomplete="current-password">
          </div>
        </div>
        <button type="submit" class="btn-login mt-2">Login <i class="bi bi-box-arrow-in-right ms-1"></i></button>
        <div id="loginMessage" class="mt-3 text-center small"></div>
      </form>
      <footer><p class="mb-0">© 2026 PremiumDev Web Solutions Agency. Secure access only.</p></footer>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (function() {
      const SUPABASE_URL = 'https://xzhmjigiddhzyrhqwgcw.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh6aG1qaWdpZGRoenlyaHF3Z2N3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyNzkzMjQsImV4cCI6MjA5NTg1NTMyNH0.-G9WLCr4zcK5lCg_nBqBVcClhHJH_xunpflCakaDMEw';
      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const form = document.getElementById('adminLoginForm');
      const msgDiv = document.getElementById('loginMessage');
      const ALLOWED_ADMIN_EMAIL = 'r9609820766@gmail.com';

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        msgDiv.innerHTML = '<div class="spinner-border spinner-border-sm text-primary" role="status"></div> Verifying...';
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        if (!email || !password) {
          msgDiv.innerHTML = '<div class="error-msg">Please enter both email and password.</div>';
          return;
        }
        try {
          // First, check if email is the allowed admin email
          if (email !== ALLOWED_ADMIN_EMAIL) {
            msgDiv.innerHTML = '<div class="error-msg"><i class="bi bi-shield-slash"></i> Access denied. Not authorized as admin.</div>';
            return;
          }
          // Attempt sign in
          const { data, error } = await supabase.auth.signInWithPassword({ email, password });
          if (error) {
            msgDiv.innerHTML = `<div class="error-msg"><i class="bi bi-x-circle"></i> ${error.message}</div>`;
            return;
          }
          // Success
          localStorage.setItem('staffRole', 'admin');
          msgDiv.innerHTML = `<div class="success-msg"><i class="bi bi-check-circle"></i> Login successful. Redirecting...</div>`;
          setTimeout(() => {
            window.location.href = 'admin-dashboard.html';
          }, 800);
        } catch (err) {
          msgDiv.innerHTML = `<div class="error-msg"><i class="bi bi-bug"></i> Unexpected error. Try again.</div>`;
        }
      });
    })();
  </script>
</body>
</html>
